name: CI

# 规格 27.20：OpenAPI / SDK / 文档随每次 API 发布一起走，必须有一条自动门禁。
# 这里只跑不需要数据库的检查；集成与 E2E 需要起 PostgreSQL，放在单独的 job（见下）。

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 类型 / 契约 / 单测 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 生成 Prisma Client
        run: npx prisma generate
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        # 阶段 7：不再 continue-on-error。存量 React Compiler 两条规则已在
        # eslint.config.mjs 降为 warn 并登记 ESLINT_DEBT.md；其余 error 一律拦截。
        run: npm run lint
      - name: OpenAPI 契约 lint
        run: npm run lint:openapi
      - name: 单元测试
        run: npm run test
      - name: 生产构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  supply-chain:
    name: 供应链审计（npm audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 生产依赖 critical 门禁
        # 只拦 critical；high 及以下由下一步打印，不阻断合并。
        run: npm audit --omit=dev --audit-level=critical
      - name: 全量依赖审计（含 dev，仅报告）
        # 显式 `|| true` 让步骤保持绿色，同时完整输出 high/medium/low；
        # 这里不是 continue-on-error，门禁步骤本身仍会失败。
        run: npm audit --audit-level=critical || true

  integration:
    name: 集成测试（真实 PostgreSQL）
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: licensing
          POSTGRES_PASSWORD: licensing_ci_pw
          POSTGRES_DB: licensing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U licensing -d licensing"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      LICENSE_DB_URL: postgresql://licensing:licensing_ci_pw@127.0.0.1:5432/licensing?schema=public
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789
      LICENSE_HMAC_PEPPER: ci-hmac-pepper-0123456789abcdef0123456789
      BACKUP_ENCRYPTION_KEY: ci-backup-key-0123456789abcdef0123456789ab
      APP_BASE_URL: http://127.0.0.1:3000
      ASSERTION_AUDIENCE: license-api
      DEPLOYMENT_ENV: development
      DEV_MAIL_SINK: "false"
      DISABLE_WEBHOOK_WORKER: "true"
      DISABLE_BACKUP_SCHEDULER: "true"
      TEST_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: 建表并灌种子
        run: |
          npx prisma migrate deploy
          npm run db:seed
      - name: 构建
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: 起服务
        run: |
          npm run start -- -p 3000 -H 127.0.0.1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/v1/status >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/v1/status >/dev/null
      - name: 集成测试
        run: npx vitest run tests/integration
